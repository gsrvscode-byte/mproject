services:

  jenkins:
    build:
      context: ./jenkins
    container_name: jenkins

    ports:
      - "8080:8080"   # Jenkins web UI
      - "50000:50000" # Agent connection port (unused with agent:any on the controller, but standard to expose)

    volumes:
      # Jenkins' own data: jobs, config, plugins, credentials.
      - jenkins_home:/var/jenkins_home

      # Grants access to the HOST's Docker daemon so pipeline
      # steps (docker build / docker compose up) control your
      # real Docker, not a nested one.
      - /var/run/docker.sock:/var/run/docker.sock

      # Mounts this exact project folder into the container at
      # the SAME path it lives at on your WSL host. This lets
      # you point a Jenkins pipeline job at a local
      # "file:///..." repo URL using this path, with no
      # separate git push/pull step needed for local testing.
      #
      # IMPORTANT: replace the left-hand side below with your
      # actual project path on the WSL filesystem, e.g.
      # "/home/youruser/mproject2:/home/youruser/mproject2".
      # Run `pwd` inside the project folder to get the exact
      # path to use on both sides.
      - ${PWD}:${PWD}

    restart: unless-stopped

volumes:
  jenkins_home:
