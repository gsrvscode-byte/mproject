events {
    worker_connections 1024;
}

http {

    # Docker's embedded DNS server. Re-resolving the "api"
    # hostname on each TTL expiry (rather than once at
    # startup) is what makes this actually load-balance
    # across replicas as you scale api up or down —
    # a static "upstream { server api:5000; }" block would
    # only ever resolve one replica and stick to it.
    resolver 127.0.0.11 valid=10s;

    server {

        listen 80;

        location / {

            set $upstream http://api:5000;
            proxy_pass $upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

    }

}
