services:

  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  api:
    build: .
    container_name: ecommerce-api

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

      # IMPORTANT:
      # Do NOT use localhost here.
      DB_HOST: mysql
      DB_PORT: 3306

      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ecommerce

      JWT_SECRET: mysecretkey

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data: